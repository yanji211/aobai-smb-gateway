version: 1

# 数据目录：SQLite、token、日志、快照区
data_dir: D:\fsgw\data

shares:
  - share_id: main
    root: 'D:\share'
    name: share            # SMB 共享名，\\主机\share 就是它
    writable: true
    media: true

index:
  debounce_structural_ms: 150
  debounce_content_ms: 400
  hash_max_mb: 64
  reconcile_interval: 6h
  write_queue_structural: 1024
  write_queue_content: 8192

# 内容快照：第一版默认关闭（SMB 来源无法写前捕获，见 docs/04 D-02）
snapshot:
  enabled: false
  mode: best_effort
  quota_gb: 200
  min_free_gb: 20

smb:
  enabled: true
  # 引擎：auto（默认，自研服务端优先，失败回退系统共享）/ go / native
  #   go     = 进程内纯 Go SMB2/3 服务端，接管 445（与 Linux 同一套代码）
  #            Win11 24H2 强制签名可过；免密不用改 ForceGuest
  #   native = 托管 Windows 自带共享（net share），免密要靠整机来宾模式
  engine: auto
  # account = 必须用账户口令登录
  # guest   = 免密（自研服务端下"免密 + 账号"可以并存，见下面的 admin）
  auth: guest
  # Win11 24H2+ 客户端强制签名，来宾会话签不了名，必须有一个真账号可登。
  # 账号口令只留 NT 哈希（明文不入库）；重新生成：fsgw smb nt-hash <口令>
  account_name: admin
  password: ""
  nt_hash: "00000000000000000000000000000000"  # 占位值！部署前用 fsgw smb nt-hash <口令> 生成后替换
  lan_only: true
  # 免密模式下是否允许写入。false = 只读（整块共享都会变只读，含账号登录）
  guest_writable: true
  # 关闭时是否连 445 放行规则一起删；保持 false，免得影响你别的共享
  exclusive: false

  # macOS 自动写的影子文件（.DS_Store / ._xxx / .Trashes …）在目录枚举里怎么处理：
  #   hide（默认，留空等同）= 只对非 macOS 接入端隐藏：Windows/Linux/电视看到的是干净目录，
  #                          mac 自己仍看得见（它找得到就不会每次进目录重写一遍）
  #   all                   = 连 mac 一起藏
  #   off                   = 都不过滤，排障用
  # 存量文件（磁盘上照旧存在）用 `fsgw clean-meta` 清，默认只列清单，-force 才删。
  apple_meta: hide

  # 纯 SMB1 客户端（小米电视、老投影、老播放器）走哪条通道。
  # 网关自己只讲 SMB2/3；这类客户端只认 NT LM 0.12，认出后那条 TCP 连接会交给
  # 进程内置的最小 SMB1 通道（internal/smbgo/smb1srv.go，Linux/Windows 同一套代码）。
  # 留空 = 用内置通道，不需要在系统里装 samba。
  # 只有想改用外部 samba 时才填地址（deploy/linux/smb1.conf：只监听回环 4450、只讲 NT1）：
  #   smb1_backend: 127.0.0.1:4450
  smb1_backend: ""

dlna:
  enabled: true
  http_port: 8200
  friendly_name: '88share'

# 外部只读面。口令推荐在控制台「外部访问口令」里改，
# 那里只写哈希进来，明文不落盘。
webdav:
  enabled: true
  bind: 127.0.0.1:8443
  username: admin
  password: ""
  password_hash: ""  # 未设置：在控制台「外部访问口令」里设置后自动写回

ui:
  # 默认只绑回环：本机浏览器直接开 http://127.0.0.1:8444/
  # 要让局域网别的机器访问，改成下面三行（token 鉴权与 Host/Origin 校验依然生效）：
  #   bind: 0.0.0.0:8444
  #   allow_remote: true
  #   allowed_hosts: [fsgw.lan]     # 走域名访问时填，按 IP 访问可不填
  bind: 127.0.0.1:8444

switch:
  # 2026-11-14：改为 LAN，开机即开放局域网面（445 / 8200 / 8445），
  # 电视等纯 SMB1 客户端不用每次手动开开关。
  startup_state: LAN       # OFF | LAN | WAN | ALL

log:
  level: info
  audit_retention_days: 30

sync:
  # 快同步：客户端用 fsgw-sync 推目录过来（分块并行 + 位图续传 + 小文件打包）。
  # 属于局域网面：总开关为 OFF / WAN 时不监听。令牌在 <data_dir>/sync.token。
  enabled: true
  bind: 0.0.0.0:8445
  allow_remote: true       # 绑非回环必须显式点头
  roots: []                # 空 = 所有 writable 的共享根；也可写 share_id 列表
  chunk_mb: 4              # 1–32
  max_files: 1000000        # 单次会话清单上限（一个 node_modules 目录就十几万）
  max_parallel_files: 16
  session_ttl_hours: 72    # 超期会话连同 .part 一起清掉
  verify: chunk            # chunk=只验每块(快) | full=落盘后再整文件 hash
