# fsgw 的 SMB1 兼容后端（只给"仅支持 SMB1"的老设备用）
#
# 背景：网关自己的 SMB 服务端是纯 SMB2/3 实现（internal/smbgo），小米电视这类
# 老客户端的 SMB 客户端只声明 `NT LM 0.12` 一个方言，拿到 SMB2 协商响应后
# 直接放弃。这里用一份独立的 samba 实例兜住它们：只监听回环的 4450，网关
# 判定"纯 SMB1 客户端"后把那条 TCP 连接原样转交过来。
#
# 三条必须守住：
#   1. 绝不监听 445（445 是网关自持的），所以 smb ports 只写 4450 + 只绑 lo；
#   2. 只提供 SMB1（server min/max protocol = NT1），别让它变成第二套 SMB2 服务；
#   3. 所有运行目录都独立，不碰 /var/lib/samba 与系统 smbd（系统 smbd/nmbd 已被 mask）。
#
# 改完重启：sudo systemctl restart fsgw-smb1

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = fsgw SMB1 兼容通道
   netbios name = FSGW-SMB1

   # 只监听回环的 4450；445 归网关
   smb ports = 4450
   interfaces = 127.0.0.1
   bind interfaces only = yes

   # 只讲 SMB1
   server min protocol = NT1
   server max protocol = NT1
   client min protocol = SMB2

   # 匿名放行：老电视不会送凭据
   security = user
   map to guest = Bad User
   guest account = nobody
   restrict anonymous = 0
   # 老客户端有送 NTLMv1 的，放行以便握手完成
   # （lanman auth 在 samba 4.x 已废弃，加了只会在日志里刷 WARNING）
   ntlm auth = ntlmv1-permitted

   # 打印、DFS、Unix 扩展一律关掉：老客户端看到这些扩展容易走进死路
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   host msdfs = no
   unix extensions = no
   wide links = no

   # 独立运行目录，不碰系统 samba 的状态
   pid directory = /run/fsgw-smb1
   lock directory = /var/lib/fsgw/smb1/lock
   state directory = /var/lib/fsgw/smb1/state
   cache directory = /var/lib/fsgw/smb1/cache
   private dir = /var/lib/fsgw/smb1/private

   log file = /var/log/fsgw/smb1.log
   max log size = 2000
   log level = 1

[share]
   comment = fsgw 共享（SMB1 兼容通道）
   path = /srv/share
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   create mask = 0644
   directory mask = 0755
   # 隐藏点文件：mac 写的 .DS_Store / ._xxx 也走这条 samba，不过网关的过滤，
   # 所以这里必须自己藏起来，否则电视里会冒出一堆 "._xxx"。
   # （电视播放器要访问的媒体文件都不是点开头的，隐藏没有副作用。）
   hide dot files = yes
   veto files = /._*/.DS_Store/.Trashes/.Spotlight-V100/.fseventsd/.TemporaryItems/
